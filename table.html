<div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="border-b border-gray-700 text-gray-400 uppercase text-xs tracking-wider">
                <th class="py-3 px-4">Zeitraum / Datum</th>
                <th class="py-3 px-4">Blockchain</th>
                <th class="py-3 px-4">Protokoll</th>
                <th class="py-3 px-4">Token Ertrag</th>
                <th class="py-3 px-4 text-right">Gegenwert (Dynamisch)</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-700">
            {% for row in records %}
            <tr class="hover:bg-gray-750/50 transition">
                <td class="py-4 px-4 font-mono text-sm text-gray-300">
                    {{ row.timestamp.strftime('%Y-%m-%d') }}
                </td>
                <td class="py-4 px-4">
                    <span class="px-2 py-1 bg-gray-700 text-gray-200 rounded text-xs font-semibold">
                        {{ row.chain }}
                    </span>
                </td>
                <td class="py-4 px-4 text-gray-300">{{ row.protocol }}</td>
                <td class="py-4 px-4 text-emerald-400 font-semibold">
                    {{ "%.4f"|format(row.amount) }} {{ row.token_symbol }}
                </td>
                <td class="py-4 px-4 text-right font-mono font-bold text-white">
                    {{ symbol }} {{ "%.2f"|format(row.value_converted) }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
