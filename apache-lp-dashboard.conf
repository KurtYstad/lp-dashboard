# Example Apache virtual hosts for the LP Dashboard.
# Replace lp.example.com and the certificate paths with your own values.

<VirtualHost *:80>
    ServerName lp.example.com

    RewriteEngine On
    RewriteRule ^ https://lp.example.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/lp-dashboard_error.log
    CustomLog ${APACHE_LOG_DIR}/lp-dashboard_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lp.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lp.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Location "/">
        AuthType Basic
        AuthName "LP Dashboard"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/.lp-dashboard.htpasswd
        Require valid-user
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/lp-dashboard_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lp-dashboard_ssl_access.log combined
</VirtualHost>
