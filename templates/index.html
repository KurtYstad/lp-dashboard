{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl font-bold">
            <a href="{{ request.url_for('read_root') }}"
               class="inline-flex items-center gap-2 text-emerald-400 hover:text-emerald-300 focus-visible:rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-400">
                <span aria-hidden="true">📈</span>
                <span>LP Yield Dashboard</span>
            </a>
        </h1>
        <button id="new-position-button" type="button"
                class="rounded bg-emerald-600 px-5 py-3 font-semibold text-white transition hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400">
            Neue Position
        </button>
    </header>

    <dialog id="new-position-dialog"
            aria-labelledby="new-position-title"
            class="mx-4 w-full max-w-lg rounded-xl border border-gray-700 bg-gray-800 p-0 text-gray-100 shadow-2xl backdrop:bg-black/70">
        <form id="new-position-form" action="{{ request.url_for('add_position') }}"
              class="space-y-5 p-6">
            <h2 id="new-position-title" class="text-xl font-semibold">
                Neue Position eintragen
            </h2>

            <section id="new-position-protocol-step" class="space-y-4">
                <label for="new-position-protocol" class="block text-sm text-gray-300">
                    Protokoll
                </label>
                <select id="new-position-protocol" name="protocol" required
                        class="w-full rounded border border-gray-600 bg-gray-700 p-3 text-white">
                    <option value="" selected disabled>Protokoll auswählen</option>
                    {% for protocol in position_notifiers %}
                    <option value="{{ protocol.key }}"
                            data-uniswap="{{ 'true' if protocol.is_uniswap else 'false' }}">
                        {{ protocol.label }}
                    </option>
                    {% endfor %}
                </select>
                <div class="flex justify-end gap-3">
                    <button id="new-position-cancel" type="button"
                            class="rounded bg-gray-600 px-4 py-2 font-semibold hover:bg-gray-500">
                        Abbrechen
                    </button>
                    <button id="new-position-next" type="button"
                            class="rounded bg-emerald-600 px-4 py-2 font-semibold hover:bg-emerald-500">
                        Weiter
                    </button>
                </div>
            </section>

            <section id="new-position-details-step" class="hidden space-y-4">
                <label for="new-position-id" class="block text-sm text-gray-300">
                    Positions-ID
                </label>
                <input id="new-position-id" name="position_id" type="text"
                       required maxlength="78" autocomplete="off"
                       class="w-full rounded border border-gray-600 bg-gray-700 p-3 text-white">

                <div id="new-position-version-field" class="hidden">
                    <label for="new-position-version" class="mb-2 block text-sm text-gray-300">
                        Uniswap-Version (optional)
                    </label>
                    <select id="new-position-version" name="version" disabled
                            class="w-full rounded border border-gray-600 bg-gray-700 p-3 text-white">
                        <option value="">Automatisch ermitteln</option>
                        <option value="v3">v3</option>
                        <option value="v4">v4</option>
                    </select>
                </div>

                <p id="new-position-status" class="hidden text-sm" role="alert"
                   aria-live="polite"></p>
                <div class="flex justify-between gap-3">
                    <button id="new-position-back" type="button"
                            class="rounded bg-gray-600 px-4 py-2 font-semibold hover:bg-gray-500">
                        Zurück
                    </button>
                    <button id="new-position-submit" type="submit"
                            class="rounded bg-emerald-600 px-4 py-2 font-semibold hover:bg-emerald-500">
                        Eintragen und abfragen
                    </button>
                </div>
            </section>
        </form>
    </dialog>

    {% if filter_error %}
    <p class="mb-4 rounded bg-red-900/50 p-4 text-red-200" role="alert">{{ filter_error }}</p>
    {% endif %}

    <form id="dashboard-filters" method="post"
          action="{{ request.url_for('update_dashboard') }}"
          hx-post="{{ request.url_for('update_dashboard') }}"
          hx-target="#table-container" 
          hx-trigger="change, submit, load"
          hx-on::response-error="document.getElementById('table-container').innerHTML = event.detail.xhr.responseText"
          class="mb-8 space-y-4">
        <div class="grid items-stretch gap-4 lg:grid-cols-[minmax(0,1fr)_18rem]">
            <section class="flex flex-col rounded-xl bg-gray-800 p-6 shadow-lg" aria-labelledby="filters-heading">
                <h2 id="filters-heading" class="mb-4 text-sm font-semibold uppercase tracking-wider text-gray-300">Filter</h2>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <div>
                        <label class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Blockchain</label>
                        <select name="blockchain" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="all">Alle Blockchains</option>
                            {% for bc in blockchains %}
                            <option value="{{ bc }}">{{ bc }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Token</label>
                        <select name="token" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="all">Alle Tokens</option>
                            {% for t in tokens %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="position-id" class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Position ID</label>
                        <select id="position-id" name="position_id" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="">Alle Positionen</option>
                            <option value="__open_positions__">Offene Positionen</option>
                            {% for position_id in position_ids %}
                            <option value="{{ position_id }}">{{ position_id }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="view" class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Ansicht</label>
                        <select id="view" name="view" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="positions">Je Position</option>
                            <option value="token_totals">Summen je Token-Symbol</option>
                        </select>
                    </div>

                    <div>
                        <label class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Gruppierung</label>
                        <select name="period" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="D">Täglich</option>
                            <option value="W">Wöchentlich</option>
                            <option value="M">Monatlich</option>
                            <option value="Y">Jährlich</option>
                        </select>
                        <p class="mt-1 text-xs text-gray-400">Alle verfügbaren Daten</p>
                    </div>

                    <div>
                        <label class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Währung</label>
                        <select name="currency" class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                        </select>
                    </div>
                </div>
                <div class="mt-auto flex flex-col justify-center gap-3 pt-6 sm:flex-row">
                    <button type="submit"
                            class="rounded bg-emerald-600 px-6 py-3 font-semibold text-white transition hover:bg-emerald-500">
                        Aktualisieren
                    </button>
                    <button type="button"
                            onclick="this.form.reset(); htmx.trigger(this.form, 'submit')"
                            class="rounded bg-gray-600 px-6 py-3 font-semibold text-white transition hover:bg-gray-500">
                        Filter zurücksetzen
                    </button>
                </div>
            </section>

            <section class="rounded-xl bg-gray-800 p-6 shadow-lg" aria-labelledby="date-range-heading">
                <h2 id="date-range-heading" class="mb-4 text-sm font-semibold uppercase tracking-wider text-gray-300">Datumsbereich</h2>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label for="start-date" class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Von</label>
                        <input id="start-date" name="start_date" type="date"
                               class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white"
                               aria-label="Startdatum der Erträge">
                    </div>

                    <div>
                        <label for="end-date" class="mb-2 block text-xs uppercase tracking-wider text-gray-400">Bis</label>
                        <input id="end-date" name="end_date" type="date"
                               class="w-full rounded border border-gray-600 bg-gray-700 p-2 text-white"
                               aria-label="Enddatum der Erträge">
                    </div>
                </div>
            </section>
        </div>

    </form>

    <div id="table-container" class="bg-gray-800 rounded-xl p-6 shadow-lg">
        <p id="dashboard-loading" class="text-center text-gray-400">Lade Ertragsdaten...</p>
    </div>
</div>
<script>
    window.invertPositionPrice = (toggle) => {
        const range = toggle.closest("[data-price-range]");
        if (!range) {
            return;
        }

        const lower = Number(range.dataset.lower);
        const upper = Number(range.dataset.upper);
        const current = Number(range.dataset.price);
        if (![lower, upper, current].every((value) => Number.isFinite(value) && value > 0)) {
            return;
        }

        const inverted = toggle.checked;
        const shownLower = inverted ? 1 / upper : lower;
        const shownUpper = inverted ? 1 / lower : upper;
        const shownCurrent = inverted ? 1 / current : current;
        const marker = shownUpper === shownLower
            ? 50
            : Math.max(
                0,
                Math.min(100, ((shownCurrent - shownLower) / (shownUpper - shownLower)) * 100),
            );
        const formatter = new Intl.NumberFormat("de-DE", {
            maximumSignificantDigits: 8,
        });
        range.querySelector("[data-range-min]").textContent =
            formatter.format(shownLower);
        range.querySelector("[data-range-max]").textContent =
            formatter.format(shownUpper);
        range.querySelector("[data-range-current]").textContent =
            formatter.format(shownCurrent);
        range.querySelector("[data-range-marker]").style.left = `${marker}%`;
        const pair = range.querySelector("[data-price-pair]");
        pair.textContent = inverted
            ? `${pair.dataset.baseSymbol} pro ${pair.dataset.quoteSymbol}`
            : `${pair.dataset.quoteSymbol} pro ${pair.dataset.baseSymbol}`;
        const details = range.closest("[data-live-position-details]");
        const chartPair = details.querySelector("[data-price-chart-pair]");
        if (chartPair) {
            chartPair.textContent = pair.textContent;
        }
        range.dataset.inverted = String(inverted);

        const priceCanvas = details.querySelector("#position-price-chart");
        const chart = window.Chart?.getChart(priceCanvas);
        const chartDataElement = details.querySelector("#position-chart-data");
        if (chart && chartDataElement) {
            const { labels, values, lower: chartLower, upper: chartUpper } =
                JSON.parse(chartDataElement.textContent).prices;
            const shownChartLower = inverted ? 1 / chartUpper : chartLower;
            const shownChartUpper = inverted ? 1 / chartLower : chartUpper;
            chart.data.datasets[0].data = values.map((value) =>
                inverted ? 1 / value : value,
            );
            chart.data.datasets[1].data = labels.map(() => shownChartLower);
            chart.data.datasets[2].data = labels.map(() => shownChartUpper);
            chart.update();
        }
    };

    (() => {
        const tableContainer = document.getElementById("table-container");
        let currentPage = 1;
        const textCollator = new Intl.Collator("de", { numeric: true });
        const numberFormatter = new Intl.NumberFormat("de-DE", {
            maximumFractionDigits: 0,
        });

        const renderPage = () => {
            const pageSizeSelect = tableContainer.querySelector("#table-page-size");
            if (!pageSizeSelect) {
                return;
            }

            const rows = [...tableContainer.querySelectorAll("[data-dashboard-row]")];
            const pageSize = pageSizeSelect.value === "all"
                ? Math.max(rows.length, 1)
                : Number(pageSizeSelect.value);
            const pageCount = Math.max(1, Math.ceil(rows.length / pageSize));
            currentPage = Math.min(currentPage, pageCount);

            const firstRow = (currentPage - 1) * pageSize;
            const lastRow = Math.min(firstRow + pageSize, rows.length);
            rows.forEach((row, index) => {
                row.hidden = index < firstRow || index >= lastRow;
            });

            tableContainer.querySelector("#table-page-summary").textContent = rows.length
                ? `${numberFormatter.format(firstRow + 1)}–${numberFormatter.format(lastRow)} von ${numberFormatter.format(rows.length)}`
                : `${numberFormatter.format(0)} Einträge`;
            tableContainer.querySelector("#table-page-indicator").textContent =
                `${numberFormatter.format(currentPage)} / ${numberFormatter.format(pageCount)}`;
            tableContainer.querySelector('[data-page-action="previous"]').disabled =
                currentPage <= 1;
            tableContainer.querySelector('[data-page-action="next"]').disabled =
                currentPage >= pageCount;
        };

        document.addEventListener("change", (event) => {
            if (event.target.id === "table-page-size") {
                currentPage = 1;
                renderPage();
                return;
            }

        });

        document.body.addEventListener("htmx:responseError", (event) => {
            const requestElement = event.detail.elt;
            if (!requestElement) {
                return;
            }
            const detailsElement = requestElement.closest("details[hx-get]");
            const detailsContent = detailsElement?.querySelector(
                "[data-position-details], [data-performance-summary]",
            );
            if (detailsContent) {
                detailsContent.innerHTML = event.detail.xhr.responseText;
            }
        });

        tableContainer.addEventListener("click", (event) => {
            const sortButton = event.target.closest("[data-sort-column]");
            if (sortButton) {
                const table = sortButton.closest("table");
                const columnIndex = Number(sortButton.dataset.sortColumn);
                const header = sortButton.closest("th");
                const direction = header.getAttribute("aria-sort") === "descending"
                    ? "ascending"
                    : "descending";
                const rows = [...table.querySelectorAll("tbody [data-dashboard-row]")];
                const sortType = sortButton.dataset.sortType;

                rows.sort((left, right) => {
                    const leftCell = left.cells[columnIndex];
                    const rightCell = right.cells[columnIndex];
                    const leftValue = leftCell.dataset.sortValue ?? "";
                    const rightValue = rightCell.dataset.sortValue ?? "";
                    if (leftValue === "" || rightValue === "") {
                        return leftValue === rightValue ? 0 : leftValue === "" ? 1 : -1;
                    }

                    let comparison = sortType === "number"
                        ? Number(leftValue) - Number(rightValue)
                        : textCollator.compare(leftValue, rightValue);
                    if (comparison === 0 && columnIndex === 3) {
                        comparison = textCollator.compare(
                            leftCell.dataset.sortSecondary ?? "",
                            rightCell.dataset.sortSecondary ?? "",
                        );
                    }
                    return direction === "descending" ? -comparison : comparison;
                });
                rows.forEach((row) => table.tBodies[0].append(row));
                table.querySelectorAll("[data-sort-column]").forEach((button) => {
                    const columnHeader = button.closest("th");
                    if (button === sortButton) {
                        columnHeader.setAttribute(
                            "aria-sort",
                            direction === "descending" ? "descending" : "ascending",
                        );
                        button.lastElementChild.textContent =
                            direction === "descending" ? "↓" : "↑";
                    } else {
                        columnHeader.setAttribute("aria-sort", "none");
                        button.lastElementChild.textContent = "↕";
                    }
                });
                currentPage = 1;
                renderPage();
                return;
            }

            const button = event.target.closest("[data-page-action]");
            if (!button || button.disabled) {
                return;
            }
            currentPage += button.dataset.pageAction === "next" ? 1 : -1;
            renderPage();
        });

        document.addEventListener("htmx:afterSwap", (event) => {
            if (event.detail.target === tableContainer) {
                currentPage = 1;
                renderPage();
            }
        });
    })();

    (() => {
        const filterPerformanceRows = (table) => {
            const activeOnly = table.parentElement.querySelector(
                "[data-performance-active-filter]",
            ).checked;
            const protocol = table.parentElement.querySelector(
                "[data-performance-protocol-filter]",
            ).value;
            const blockchain = table.parentElement.querySelector(
                "[data-performance-blockchain-filter]",
            ).value;
            table.querySelectorAll("[data-performance-row]").forEach((row) => {
                row.hidden =
                    (activeOnly && row.dataset.active !== "true") ||
                    (protocol !== "" && row.dataset.protocol !== protocol) ||
                    (blockchain !== "" && row.dataset.chain !== blockchain);
            });
        };

        document.addEventListener("change", (event) => {
            if (!event.target.matches(
                "[data-performance-active-filter], " +
                "[data-performance-protocol-filter], " +
                "[data-performance-blockchain-filter]",
            )) {
                return;
            }
            const table = event.target.closest("[data-performance-summary]")
                ?.querySelector("[data-performance-table]");
            if (table) {
                filterPerformanceRows(table);
            }
        });

        document.addEventListener("click", (event) => {
            const sortButton = event.target.closest("[data-performance-sort-column]");
            if (!sortButton) {
                return;
            }

            const table = sortButton.closest("[data-performance-table]");
            const columnIndex = Number(sortButton.dataset.performanceSortColumn);
            const header = sortButton.closest("th");
            const direction = header.getAttribute("aria-sort") === "descending"
                ? "ascending"
                : "descending";
            const rows = [...table.querySelectorAll("tbody [data-performance-row]")];
            rows.sort((left, right) => {
                const leftValue = left.cells[columnIndex].dataset.sortValue ?? "";
                const rightValue = right.cells[columnIndex].dataset.sortValue ?? "";
                if (leftValue === "" || rightValue === "") {
                    return leftValue === rightValue ? 0 : leftValue === "" ? 1 : -1;
                }
                const comparison = Number(leftValue) - Number(rightValue);
                return direction === "descending" ? -comparison : comparison;
            });
            rows.forEach((row) => table.tBodies[0].append(row));
            table.querySelectorAll("[data-performance-sort-column]").forEach((button) => {
                const columnHeader = button.closest("th");
                if (button === sortButton) {
                    columnHeader.setAttribute(
                        "aria-sort",
                        direction === "descending" ? "descending" : "ascending",
                    );
                    button.lastElementChild.textContent =
                        direction === "descending" ? "↓" : "↑";
                } else {
                    columnHeader.setAttribute("aria-sort", "none");
                    button.lastElementChild.textContent = "↕";
                }
            });
        });

        document.addEventListener("htmx:afterSwap", (event) => {
            const target = event.detail.target;
            if (target.matches("[data-performance-summary]")) {
                const table = target.querySelector("[data-performance-table]");
                if (table) {
                    filterPerformanceRows(table);
                }
            }
        });
    })();
</script>
<script>
    (() => {
        const dialog = document.getElementById("new-position-dialog");
        const form = document.getElementById("new-position-form");
        const protocolSelect = document.getElementById("new-position-protocol");
        const protocolStep = document.getElementById("new-position-protocol-step");
        const detailsStep = document.getElementById("new-position-details-step");
        const versionField = document.getElementById("new-position-version-field");
        const versionSelect = document.getElementById("new-position-version");
        const positionIdInput = document.getElementById("new-position-id");
        const status = document.getElementById("new-position-status");
        const submitButton = document.getElementById("new-position-submit");

        document.getElementById("new-position-button").addEventListener("click", () => {
            form.reset();
            status.textContent = "";
            status.classList.add("hidden");
            protocolStep.classList.remove("hidden");
            detailsStep.classList.add("hidden");
            dialog.showModal();
        });

        document.getElementById("new-position-cancel").addEventListener("click", () => {
            dialog.close();
        });

        document.getElementById("new-position-next").addEventListener("click", () => {
            if (!protocolSelect.reportValidity()) {
                return;
            }

            const isUniswap =
                protocolSelect.selectedOptions[0].dataset.uniswap === "true";
            versionField.classList.toggle("hidden", !isUniswap);
            versionSelect.disabled = !isUniswap;
            positionIdInput.placeholder = protocolSelect.value === "orca"
                ? "Orca-Positionsadresse (44 Zeichen)"
                : protocolSelect.value === "raydium"
                    ? "Raydium Position-Account-Adresse"
                    : "Numerische Positions-ID";
            positionIdInput.inputMode = isUniswap
                || ["aero", "cake"].includes(protocolSelect.value)
                ? "numeric"
                : "text";
            protocolStep.classList.add("hidden");
            detailsStep.classList.remove("hidden");
            positionIdInput.focus();
        });

        document.getElementById("new-position-back").addEventListener("click", () => {
            detailsStep.classList.add("hidden");
            protocolStep.classList.remove("hidden");
            protocolSelect.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) {
                return;
            }

            const protocolLabel =
                protocolSelect.selectedOptions[0].textContent.trim();
            const versionLabel = versionSelect.disabled
                ? ""
                : `\nVersion: ${versionSelect.value || "automatisch ermitteln"}`;
            const confirmed = window.confirm(
                `Neue Position eintragen und erstmalig abfragen?\n\n` +
                `Protokoll: ${protocolLabel}\n` +
                `ID: ${positionIdInput.value.trim()}${versionLabel}`,
            );
            if (!confirmed) {
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Wird eingetragen und abgefragt …";
            status.textContent = "";
            status.classList.add("hidden");

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: new URLSearchParams(new FormData(form)),
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || "Die Position konnte nicht eingetragen werden.");
                }
                window.location.reload();
            } catch (error) {
                status.textContent = error.message;
                status.classList.remove("hidden");
                status.classList.add("text-red-300");
                submitButton.disabled = false;
                submitButton.textContent = "Erneut versuchen";
            }
        });
    })();
</script>
{% endblock %}
